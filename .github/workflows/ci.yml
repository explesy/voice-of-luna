name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Check JavaScript syntax
        run: |
          node --check app/static/voice.js
          node --check app/static/js/audio-player.js
          node --check app/static/js/terminal-formatter.js
          node --check app/static/js/vad.js
          node --check app/static/pcm-recorder-processor.js
        working-directory: backend
      - name: Install dependencies
        run: uv sync --group dev
        working-directory: backend
      - name: Smoke test production install
        run: |
          uv sync --no-dev
          uv run python -c "import app.transcribe, app.whisper_server, app.speak, app.main; print('Production import OK')"
          uv sync --group dev
        working-directory: backend
      - name: Run tests
        run: uv run pytest -q --junitxml=pytest-results.xml
        working-directory: backend
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pytest-results-${{ matrix.os }}
          path: backend/pytest-results.xml
      - name: Install browser smoke dependencies
        run: npm ci
      - name: Install Chromium (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium (macOS)
        if: matrix.os == 'macos-latest'
        run: npx playwright install chromium
      - name: Run browser smoke
        run: npm run test:e2e
      - name: Upload browser smoke artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-results-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
