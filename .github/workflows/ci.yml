name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --group dev
        working-directory: backend
      - name: Smoke test production install
        run: |
          uv sync --no-dev
          uv run python -c "import app.transcribe, app.whisper_server, app.speak, app.main; print('Production import OK')"
          uv sync --group dev
        working-directory: backend
      - name: Run tests
        run: uv run pytest -q
        working-directory: backend
