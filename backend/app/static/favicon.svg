<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Radiant Gold -->
    <linearGradient id="starGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Neon Celestial Cyan -->
    <linearGradient id="starCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#7dd3fc"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Contrast Shadow -->
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.75" stdDeviation="0.6" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <g filter="url(#starGlow)">
    <!-- 4 Diagonal Gold Rays with Tarot Diamond Tips -->
    <g stroke="url(#starGold)" stroke-width="1.8" stroke-linecap="round">
      <line x1="16" y1="16" x2="5" y2="5"/>
      <line x1="16" y1="16" x2="27" y2="27"/>
      <line x1="16" y1="16" x2="5" y2="27"/>
      <line x1="16" y1="16" x2="27" y2="5"/>
    </g>

    <!-- 4 Cardinal Radiant Cyan Diamond Rays -->
    <path d="M 16 0.5 Q 16 16 0.5 16 Q 16 16 16 31.5 Q 16 16 31.5 16 Q 16 16 16 0.5 Z"
          fill="url(#starCyan)"
          stroke="#082f49"
          stroke-width="0.7"/>

    <!-- Sacred Celestial Ring -->
    <circle cx="16" cy="16" r="6" fill="none" stroke="url(#starGold)" stroke-width="1.2"/>

    <!-- White Diamond Heart Core -->
    <circle cx="16" cy="16" r="2.4" fill="#ffffff"/>
  </g>
</svg>