[project]
name = "voice-of-luna-backend"
version = "0.16.0"
description = "Local-first conversation bridge for Voice of Luna"
requires-python = ">=3.12"
dependencies = [
  "edge-tts>=7.2.8",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "numpy>=2.5.3",
  "num2words>=0.5.13",
  "piper-tts>=1.2.0",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
silero = ["torch>=2.14.0"]

[dependency-groups]
dev = ["pytest>=8,<9", "torch>=2.14.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
